name: 🧪 Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 🧪 PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 8.2 is the minimum supported version (see ICC_OIDC_MIN_PHP).
        php: ['8.2', '8.3', '8.4']

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🐘 Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: 🔍 Lint every PHP file
        run: |
          status=0
          while IFS= read -r -d '' file; do
            php -l "${file}" || status=1
          done < <(find . -name '*.php' -not -path './.git/*' -print0)
          exit "${status}"

      - name: 🧩 Validate plugin layout
        run: php tests/validate-plugin-layout.php

      - name: 🧪 Security regression tests
        run: php tests/security-login-flow.php
